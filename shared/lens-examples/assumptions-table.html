<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assumptions table</title>
<style>
:root{--bg:var(--lens-bg,#f6f7f7);--ink:var(--lens-ink,#16201f);--faint:var(--lens-faint,#85908f);--rule:var(--lens-rule,#dfe4e3);--panel:var(--lens-panel,#fff);--accent:var(--lens-accent,#0f766e);--bad:var(--lens-bad,#b4372d);--good:var(--lens-good,#1d7a46)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{padding:16px 18px 24px;display:grid;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:end;gap:12px 18px}
h1{font-size:20px;margin:0}
h2{font-size:14px;margin:0 0 8px}
.sub{font-size:12.5px;color:var(--faint)}
.controls{display:flex;gap:10px;margin-left:auto;align-items:end;flex-wrap:wrap}
label{display:grid;gap:3px;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
select,button,input,textarea{font:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--rule);border-radius:7px;background:var(--panel);color:var(--ink)}
button{cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:default}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:12px;min-width:0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.status{font-size:13px}
.status.ok{color:var(--good)} .status.err{color:var(--bad)} .status.busy{color:var(--faint)}
.need{padding:18px;border:1px dashed var(--rule);border-radius:10px;color:var(--faint);font-size:13px}
.need code{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 id="heading">Assumptions</h1><div class="sub" id="subtitle"></div></div>
    <div class="controls"><div id="people" style="align-self:center"></div></div>
  </header>
  <div class="card">
    <div class="bar">
      <button id="save" class="primary" disabled>Save</button>
      <button id="undo" disabled>Undo</button>
      <span id="historyBtn"></span>
      <span id="status" class="status"></span>
    </div>
    <div id="grid"></div>
  </div>
</div>
<script src="/lens-kit/lens-kit.js"></script>
<script>
// ── Assumptions table (Viewfinder template) ──────────────────────────────────
// Rates, drivers and settings: one row per element (an asset type, a grade…),
// one column per assumption (life in months, a rate, a note). Numbers and text,
// typed where TM1 allows input, saved as the signed-in user.
(function () {
  var $ = function (id) { return document.getElementById(id) }
  var esc = function (v) { return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') }
  var M = function (d, e) { return '[' + d + '].[' + d + '].[' + String(e).replace(/]/g, ']]') + ']' }
  var call = function (mdx) { return window.lensBridge.call('execMDX', { mdx: mdx }) }
  var say = function (text, kind) { var s = $('status'); if (!s) return; s.textContent = text || ''; s.className = 'status ' + (kind || '') }
  function fail(e) { say((e && e.message ? e.message : e), 'err') }
  if (!window.Lens) return fail(new Error('the Lens toolkit did not load'))
  var C = Lens.config()
  function need(keys, into) {
    var missing = keys.filter(function (k) { return !C[k] })
    if (!missing.length) return false
    $(into).innerHTML = '<div class="need">This screen needs its settings — add <code>' + missing.join('</code>, <code>') + '</code> to its config (IDE → Config tab).</div>'
    return true
  }
  // A WHERE clause from { dimension: member } (missing dimensions use their default member).
  function where(obj) { var k = Object.keys(obj || {}); return k.length ? ' WHERE (' + k.map(function (d) { return M(d, obj[d]) }).join(',') + ')' : '' }
  function setOf(spec) {
    if (spec.members) return '{' + spec.members.map(function (m) { return M(spec.dimension, m) }).join(',') + '}'
    if (spec.under) return '{TM1FILTERBYLEVEL({DESCENDANTS(' + M(spec.dimension, spec.under) + ')}, ' + (spec.level || 0) + ')}'
    return '{TM1FILTERBYLEVEL({TM1SUBSETALL([' + spec.dimension + '].[' + spec.dimension + '])}, ' + (spec.level || 0) + ')}'
  }
  function names(dim, into) {
    return call('SELECT {[}ElementAttributes_' + dim + '].[}ElementAttributes_' + dim + '].[Caption_Default]} ON 0, {TM1SUBSETALL([' + dim + '].[' + dim + '])} ON 1 FROM [}ElementAttributes_' + dim + ']')
      .then(function (r) { Lens.rows(r).forEach(function (x) { if (x.Caption_Default) into[x[dim]] = x.Caption_Default }) }, function () {})
  }
  if (need(['cube', 'rows', 'columns'], 'grid')) return
  var cube = C.cube, rowDim = C.rows.dimension, colDim = C.columns.dimension
  var cols = C.columns.items || []
  var base = Object.assign({}, C.fixed || {})
  $('heading').textContent = C.heading || 'Assumptions'
  $('subtitle').textContent = C.subtitle || ''
  var rowNames = {}, g = null, tg = null, hp = null

  function coords(row, col) { var c = Object.assign({}, base); c[rowDim] = row; c[colDim] = col; return c }
  function load() {
    say('Loading…', 'busy')
    var q = 'SELECT {' + cols.map(function (c) { return M(colDim, c.member) }).join(',') + '} ON 0, ' + setOf(C.rows) + ' ON 1 FROM [' + cube + ']' + where(base)
    return call(q).then(function (r) {
      var data = Lens.rows(r).map(function (x) { var k = x[rowDim]; x.line = rowNames[k] ? rowNames[k] + ' (' + k + ')' : k; return x })
      g = Lens.grid('#grid', {
        height: C.height,
        columns: [{ field: 'line', headerName: C.rows.label || rowDim, pinned: 'left', minWidth: 180 }].concat(cols.map(function (c) {
          return { field: c.member, headerName: c.label || c.member, type: c.type === 'text' ? 'text' : 'number', format: c.format, editable: true, options: c.options, minWidth: c.type === 'text' ? 180 : 90 }
        })),
        rows: data,
        onEdit: function (ch) { $('save').disabled = $('undo').disabled = !ch.length; say(ch.length ? ch.length + ' change' + (ch.length > 1 ? 's' : '') + ' not saved' : '') }
      })
      $('save').disabled = $('undo').disabled = true
      say('')
      if (hp) Lens.history({}, { limit: 100 }).then(function (l) { hp.set(l) }, function () {})
    })
  }
  function isText(field) { return cols.some(function (c) { return c.member === field && c.type === 'text' }) }
  function save() {
    var ch = g.changes()
    if (!ch.length) return
    $('save').disabled = $('undo').disabled = true
    say('Saving…', 'busy')
    Lens.save(cube, ch.map(function (c) {
      var text = isText(c.field)
      return { coordinates: coords(c.row[rowDim], c.field), value: text ? String(c.value == null ? '' : c.value) : (Number(c.value) || 0), expect: text ? String(c.old == null ? '' : c.old) : (Number(c.old) || 0) }
    })).then(function (r) {
      g.saved(); if (tg) tg.send('saved', { count: r.written })
      return load().then(function () { say('Saved ' + r.written + ' cell' + (r.written > 1 ? 's' : '') + ' to TM1.', 'ok') })
    }).catch(function (e) { $('save').disabled = $('undo').disabled = false; say('Not saved: ' + (e && e.message ? e.message : e), 'err') })
  }
  $('save').onclick = save
  $('undo').onclick = function () { g.undo(); say('') }
  hp = Lens.historyPanel('#historyBtn', { title: 'History', describe: function (e) {
    var c = e.changes || []
    return 'changed ' + c.length + ' value' + (c.length === 1 ? '' : 's') + ': ' + c.slice(0, 4).map(function (x) { var r = x.coordinates[rowDim]; return (rowNames[r] || r) + ' ' + x.coordinates[colDim] + ' ' + (typeof x.value === 'string' ? '“' + x.value + '”' : Lens.format(x.old) + ' → ' + Lens.format(x.value)) }).join(', ')
  } })
  tg = Lens.live('#people', { onEvent: function (ev) { if (ev.type === 'saved' && g && !g.changes().length) load().catch(fail) } })
  tg.join('assumptions')
  names(rowDim, rowNames).then(load).catch(fail)
})()
</script>
</body>
</html>
