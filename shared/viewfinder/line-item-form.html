<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Line-item form</title>
<style>
/* colours follow each person's theme (Lens.theme) */
:root{--bg:var(--lens-bg,#f6f7f7);--ink:var(--lens-ink,#16201f);--soft:var(--lens-soft,#4b5756);--faint:var(--lens-faint,#85908f);--rule:var(--lens-rule,#dfe4e3);--panel:var(--lens-panel,#fff);--accent:var(--lens-accent,#0f766e);--bad:var(--lens-bad,#b4372d);--good:var(--lens-good,#1d7a46)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{padding:16px 18px 24px;display:grid;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:end;gap:12px 18px}
h1{font-size:20px;margin:0}
.sub{font-size:12.5px;color:var(--faint)}
.controls{display:flex;gap:10px;margin-left:auto;align-items:end;flex-wrap:wrap}
label{display:grid;gap:3px;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
select,button{font:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--rule);border-radius:7px;background:var(--panel);color:var(--ink)}
button{cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:default}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:12px;min-width:0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sep{width:1px;height:22px;background:var(--rule)}
.status{font-size:13px}
.status.ok{color:var(--good)} .status.err{color:var(--bad)} .status.busy{color:var(--faint)}
.totals{font-size:12.5px;color:var(--soft);margin-left:auto}
.totals b{color:var(--ink)}
.need{padding:18px;border:1px dashed var(--rule);border-radius:10px;color:var(--faint);font-size:13px}
.need code{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 id="heading">Line items</h1><div class="sub" id="subtitle"></div></div>
    <div class="controls">
      <div id="people" style="align-self:center"></div>
      <label><span id="unitLabel">Unit</span><select id="unit"></select></label>
      <label id="periodWrap"><span id="periodLabel">Period</span><select id="period"></select></label>
    </div>
  </header>
  <div class="card">
    <div class="bar">
      <button id="save" class="primary" disabled>Save</button>
      <button id="undo" disabled>Undo</button>
      <span class="sep"></span>
      <select id="addGroup" hidden title="What kind of line to add"></select>
      <button id="add">+ Add</button>
      <span id="approveBox" hidden><span class="sep" style="display:inline-block;vertical-align:middle;margin-right:10px"></span><button id="approve" disabled>✓ Approve</button> <button id="unapprove" disabled>Reopen</button></span>
      <span id="historyBtn"></span>
      <span id="status" class="status"></span>
      <span id="totals" class="totals"></span>
    </div>
    <div id="grid"></div>
  </div>
</div>
<script src="/lens-kit/lens-kit.js"></script>
<script>
// ── Line-item form (Viewfinder template) ─────────────────────────────────────
// Requests or items as lines — a capex request, a hire, a contract — one unit
// at a time (a store, a cost centre…). The lines are the leaves of a line
// dimension (and optionally of a group dimension, e.g. asset type, chosen when
// a line is added); the fields across come from the config. Optional approval:
// approvers tick a line Approved through a process that stamps who and when,
// and TM1 (a cell-security rule) then keeps the line read-only.
(function () {
  var $ = function (id) { return document.getElementById(id) }
  var esc = function (v) { return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') }
  var M = function (d, e) { return '[' + d + '].[' + d + '].[' + String(e).replace(/]/g, ']]') + ']' }
  var call = function (mdx) { return window.lensBridge.call('execMDX', { mdx: mdx }) }
  var say = function (text, kind) { $('status').textContent = text || ''; $('status').className = 'status ' + (kind || '') }
  function fail(e) { say((e && e.message ? e.message : e), 'err') }
  if (!window.Lens) return fail(new Error('the Lens toolkit did not load'))

  // ── The config ──
  var C = Lens.config()
  var missing = ['cube', 'unit', 'lines', 'fieldsDimension', 'fields'].filter(function (k) { return !C[k] })
  if (missing.length) {
    $('grid').innerHTML = '<div class="need">This line-item form needs its settings — add <code>' + missing.join('</code>, <code>') + '</code> to its config (IDE → Config tab).</div>'
    return
  }
  var cube = C.cube, unitDim = C.unit.dimension, lineDim = C.lines.dimension, groupCfg = C.group || null, fieldDim = C.fieldsDimension
  var period = C.period || null, version = C.version || null, approval = C.approval || null
  var fields = C.fields
  var required = fields.filter(function (f) { return f.required }).map(function (f) { return f.member })
  $('heading').textContent = C.heading || 'Line items'
  $('subtitle').textContent = C.subtitle || ''
  $('unitLabel').textContent = C.unit.label || unitDim
  if (period) { $('periodLabel').textContent = period.label || period.dimension; $('period').innerHTML = (period.members || []).map(function (p) { return '<option>' + esc(p) + '</option>' }).join('') }
  else $('periodWrap').hidden = true

  var unitNames = {}, groupNames = {}, g = null, data = [], who = { user: '', groups: [] }, selected = null
  var unitOf = function () { return $('unit').value }, periodOf = function () { return period ? $('period').value : '' }
  var keyOf = function (r) { return r.__line + '|' + (r.__group || '') }
  var groupName = function (g0) { var n = groupNames[g0] || g0; return n.indexOf(g0 + ' ') === 0 ? n.slice(g0.length + 1) : n }
  var label = function (r) { return (groupCfg ? groupName(r.__group) + ' ' : '') + '#' + r.__line }
  var isApproved = function (r) { return approval && String(r[approval.flag] || '') === 'Y' }
  function coords(r, field) {
    var c = Object.assign({}, C.fixed || {})
    if (version) c[version.dimension] = version.member
    c[unitDim] = unitOf()
    if (period) c[period.dimension] = periodOf()
    c[lineDim] = r.__line
    if (groupCfg) c[groupCfg.dimension] = r.__group
    c[fieldDim] = field
    return c
  }
  function slice() {
    var w = Object.keys(C.fixed || {}).map(function (d) { return M(d, C.fixed[d]) })
    if (version) w.push(M(version.dimension, version.member))
    w.push(M(unitDim, unitOf()))
    if (period) w.push(M(period.dimension, periodOf()))
    return ' WHERE (' + w.join(',') + ')'
  }
  function names(dim, into) {
    return call('SELECT {[}ElementAttributes_' + dim + '].[}ElementAttributes_' + dim + '].[Caption_Default]} ON 0, {TM1SUBSETALL([' + dim + '].[' + dim + '])} ON 1 FROM [}ElementAttributes_' + dim + ']')
      .then(function (r) { Lens.rows(r).forEach(function (x) { if (x.Caption_Default) into[x[dim]] = x.Caption_Default }) }, function () {})
  }
  function units() {
    return call('SELECT {} ON 0, {TM1FILTERBYLEVEL({TM1SUBSETALL([' + unitDim + '].[' + unitDim + '])}, ' + (C.unit.level || 0) + ')} ON 1 FROM [' + cube + ']').then(function (r) {
      var list = Lens.rows(r).map(function (x) { return x[unitDim] })
      if (!list.length) throw new Error('you have no access to any ' + (C.unit.label || unitDim).toLowerCase() + ' here')
      $('unit').innerHTML = list.map(function (o) { return '<option value="' + esc(o) + '">' + esc(unitNames[o] ? unitNames[o] + ' (' + o + ')' : o) + '</option>' }).join('')
    })
  }
  function groups() {
    if (!groupCfg) return Promise.resolve()
    return call('SELECT {} ON 0, {TM1FILTERBYLEVEL({TM1SUBSETALL([' + groupCfg.dimension + '].[' + groupCfg.dimension + '])}, ' + (groupCfg.level || 0) + ')} ON 1 FROM [' + cube + ']').then(function (r) {
      var list = Lens.rows(r).map(function (x) { return x[groupCfg.dimension] })
      $('addGroup').innerHTML = list.map(function (o) { return '<option value="' + esc(o) + '">' + esc(groupNames[o] || o) + '</option>' }).join('')
      $('addGroup').hidden = false
    })
  }

  // ── Working together ──
  var tg = null, sent = {}, hp = null
  var channel = function () { return 'lines:' + unitOf() + '|' + periodOf() }
  var byKey = function (k) { return function (r) { return keyOf(r) === k } }
  var tell = function (type, d) { if (tg) tg.send(type, d || {}) }
  function onLive(ev) {
    var f = ev.from || {}
    if (ev.type === 'leave') { if (g) { g.unmark(ev.id); if (!g.changes().length) load().catch(fail) } return }
    if (!g || !f.id) return
    if (ev.type === 'cursor') g.mark(byKey(ev.key), ev.field, f.id, { color: f.color, label: f.user + ' is here' })
    else if (ev.type === 'typing') {
      if (!data.some(byKey(ev.key)) && ev.line) g.addRow(blankRow(ev.line, ev.group))
      g.setValue(byKey(ev.key), ev.field, ev.value, f.user)
      g.mark(byKey(ev.key), ev.field, f.id, { color: f.color, label: f.user + ' typed' })
    } else if (ev.type === 'saved' || ev.type === 'history') {
      if (ev.type === 'saved') say(f.user + ' ' + (ev.note || 'saved changes') + '.', 'ok')
      var before = g.snapshot()
      if (!g.changes().length) load().then(function () { if (g) g.flashChanges(before, { key: keyOf }) }).catch(fail)
      else loadHistory()
    }
  }

  // ── History, in words ──
  function describe(e) {
    var lineOf = function (c) { return '#' + c[lineDim] + (groupCfg ? ' ' + (groupNames[c[groupCfg.dimension]] || c[groupCfg.dimension]) : '') }
    if (e.kind === 'write') {
      var ch = e.changes || [], byLine = {}
      ch.forEach(function (x) { var k = lineOf(x.coordinates); (byLine[k] = byLine[k] || []).push(x) })
      return Object.keys(byLine).map(function (k) {
        return k + ': ' + byLine[k].slice(0, 3).map(function (x) {
          var fd = fields.find(function (ff) { return ff.member === x.coordinates[fieldDim] }) || { label: x.coordinates[fieldDim] }
          return (fd.label || fd.member) + ' ' + (x.old === '' || x.old === 0 ? '' : fmt(fd, x.old) + ' → ') + fmt(fd, x.value)
        }).join(', ')
      }).join(' · ')
    }
    if (approval && e.process === approval.process) {
      var p = e.params || {}, pr = approval.params || {}
      return (p[pr.action] === 'Approve' ? 'approved ' : 'reopened ') + '#' + p[pr.line] + (e.status && e.status !== 'CompletedSuccessfully' ? ' — refused' : '')
    }
    return 'ran ' + e.process
  }
  function loadHistory() {
    var match = {}
    match[unitDim] = unitOf()
    if (period) match[period.dimension] = periodOf()
    return Lens.history(match, { limit: 100 }).then(function (list) { if (hp) hp.set(list) }, function () {})
  }

  var fmt = function (f, v) { return f.type === 'number' ? Lens.format(v, f.format || 'number') : (v === '' || v == null ? '—' : String(v)) }
  function blankRow(line, group) {
    var r = { __line: line, __group: group || '', __new: true }
    fields.forEach(function (f) { r[f.member] = f.type === 'number' ? 0 : '' })
    if (approval) { r[approval.flag] = ''; r[approval.by] = ''; r[approval.at] = '' }
    r.line = label(r)
    return r
  }
  function totals() {
    var cost = C.totalField, shown = data.filter(function (r) { return !r.__new || fields.some(function (f) { return r[f.member] && r[f.member] !== 0 }) })
    if (!cost) { $('totals').textContent = shown.length + ' line' + (shown.length === 1 ? '' : 's'); return }
    var f = fields.find(function (x) { return x.member === cost }) || { type: 'number' }
    var sum = function (rs) { return rs.reduce(function (t, r) { return t + (Number(r[cost]) || 0) }, 0) }
    var appr = data.filter(isApproved)
    $('totals').innerHTML = '<b>' + shown.length + '</b> line' + (shown.length === 1 ? '' : 's') + ' · <b>' + esc(fmt(f, sum(shown))) + '</b>' + (approval ? ' · approved <b>' + esc(fmt(f, sum(appr))) + '</b>' : '')
  }

  // ── The grid ──
  function load() {
    if (tg) tg.join(channel())
    say('Loading…', 'busy')
    var members = fields.map(function (f) { return f.member }).concat(approval ? [approval.flag, approval.by, approval.at] : [])
    var rowsSet = '{TM1FILTERBYLEVEL({TM1SUBSETALL([' + lineDim + '].[' + lineDim + '])}, ' + (C.lines.level || 0) + ')}' +
      (groupCfg ? ' * {TM1FILTERBYLEVEL({TM1SUBSETALL([' + groupCfg.dimension + '].[' + groupCfg.dimension + '])}, ' + (groupCfg.level || 0) + ')}' : '')
    var q = 'SELECT {' + members.map(function (m) { return M(fieldDim, m) }).join(',') + '} ON 0, ' + rowsSet + ' ON 1 FROM [' + cube + ']' + slice()
    return call(q).then(function (r) {
      var all = Lens.rows(r).map(function (x) {
        x.__line = x[lineDim]; x.__group = groupCfg ? x[groupCfg.dimension] : ''
        x.line = label(x)
        return x
      })
      // A line is there when something TYPED is filled in — fields TM1
      // calculates (e.g. an asset's life from its type) don't count.
      data = all.filter(function (x) { return fields.some(function (f) { var v = x[f.member]; return (!x._input || x._input[f.member] !== false) && v !== '' && v !== null && v !== 0 }) })
      data.__all = all
      draw()
      loadHistory()
    })
  }
  function draw() {
    selected = null
    var cols = (groupCfg ? [{ field: '__groupName', headerName: groupCfg.label || groupCfg.dimension, pinned: 'left', minWidth: 130, valueGetter: function (p) { return groupName(p.data.__group) } }] : [])
      .concat([{ field: '__line', headerName: '#', pinned: 'left', width: 56, minWidth: 56 }])
      .concat(fields.map(function (f) {
        return { field: f.member, headerName: f.label || f.member, type: f.type === 'number' ? 'number' : 'text', format: f.format, editable: true, options: f.options, minWidth: f.width || (f.type === 'number' ? 100 : 140) }
      }))
    if (approval) cols.push({ field: '__approved', headerName: 'Approved', minWidth: 160,
      valueGetter: function (p) { return isApproved(p.data) ? '✓ ' + (p.data[approval.by] || '') + (p.data[approval.at] ? ' · ' + Lens.localTime(p.data[approval.at]) : '') : '' } })
    g = Lens.grid('#grid', {
      height: C.height || '480px',
      columns: cols,
      rows: data,
      rowEditable: function (row) { return !isApproved(row) },
      onSelect: function (row) { selected = row; paintApprove() },
      onEdit: function (ch) {
        $('save').disabled = $('undo').disabled = !ch.length
        say(ch.length ? ch.length + ' change' + (ch.length > 1 ? 's' : '') + ' not saved' : '')
        ch.forEach(function (c) {
          var k = keyOf(c.row) + '|' + c.field
          if (sent[k] !== c.value) { sent[k] = c.value; tell('typing', { key: keyOf(c.row), line: c.row.__line, group: c.row.__group, field: c.field, value: c.value }) }
        })
        totals()
      },
      onFocus: function (row, field) { tell('cursor', { key: keyOf(row), field: field }) }
    })
    sent = {}
    $('save').disabled = $('undo').disabled = true
    totals(); paintApprove(); say('')
  }

  // A new line: the next free line (for the chosen group).
  function add() {
    var group = groupCfg ? $('addGroup').value : ''
    var taken = {}
    data.forEach(function (r) { taken[keyOf(r)] = 1 })
    var free = (data.__all || []).find(function (r) { return (!groupCfg || r.__group === group) && !taken[keyOf(r)] })
    if (!free) return say('No free lines left' + (groupCfg ? ' for ' + (groupNames[group] || group) : '') + '.', 'err')
    g.addRow(blankRow(free.__line, group))
    say('Added line ' + label(free) + ' — fill it in, then Save.', 'ok')
  }

  function save() {
    var ch = g.changes()
    if (!ch.length) return
    // Lines that were touched must have their required fields.
    var touched = {}
    ch.forEach(function (c) { touched[keyOf(c.row)] = c.row })
    var incomplete = Object.keys(touched).map(function (k) { return touched[k] }).filter(function (r) {
      return required.some(function (m) { var v = r[m]; return v === '' || v === null || v === 0 })
    })
    if (incomplete.length) return say('Fill in ' + required.map(function (m) { var f = fields.find(function (x) { return x.member === m }); return f.label || m }).join(' and ') + ' for ' + incomplete.map(label).join(', ') + ' first.', 'err')
    $('save').disabled = $('undo').disabled = true
    say('Saving…', 'busy')
    return Lens.save(cube, ch.map(function (c) {
      var f = fields.find(function (x) { return x.member === c.field }) || {}
      var text = f.type !== 'number'
      return { coordinates: coords(c.row, c.field), value: text ? String(c.value == null ? '' : c.value) : (Number(c.value) || 0), expect: text ? String(c.old == null ? '' : c.old) : (Number(c.old) || 0) }
    })).then(function (r) {
      g.saved()
      tell('saved', { note: 'saved ' + Object.keys(touched).length + ' line' + (Object.keys(touched).length === 1 ? '' : 's') })
      return load().then(function () { say('Saved ' + r.written + ' value' + (r.written > 1 ? 's' : '') + ' to TM1.', 'ok') })
    }).catch(function (e) {
      $('save').disabled = $('undo').disabled = false
      say('Not saved: ' + (e && e.message ? e.message : e), 'err')
    })
  }

  // ── Approval: only shown to approvers; the process checks again and stamps who and when ──
  function paintApprove() {
    if (!approval) return
    var can = Lens.whoami.inGroup(who, approval.approvers || [])
    $('approveBox').hidden = !can
    var real = selected && !selected.__new
    $('approve').disabled = !(can && real && !isApproved(selected))
    $('unapprove').disabled = !(can && real && isApproved(selected))
  }
  function approveAction(action) {
    if (!selected) return
    if (g.changes().length) return say('Save or undo your changes first.', 'err')
    var p = {}, pr = approval.params || {}
    p[pr.unit] = unitOf(); if (pr.period) p[pr.period] = periodOf(); if (pr.version && version) p[pr.version] = version.member
    p[pr.line] = selected.__line; if (pr.group) p[pr.group] = selected.__group; p[pr.action] = action
    say(action === 'Approve' ? 'Approving…' : 'Reopening…', 'busy')
    Lens.run(approval.process, p)
      .then(function (r) { tell('saved', { note: (action === 'Approve' ? 'approved ' : 'reopened ') + label(selected) }); return load().then(function () { say(r.message || 'Done.', 'ok') }) })
      .catch(function (e) { say('Not done: ' + (e && e.message ? e.message : e), 'err') })
  }

  $('save').onclick = save
  $('undo').onclick = function () { draw(); load().catch(fail); tell('history') }
  $('add').onclick = add
  $('approve').onclick = function () { approveAction('Approve') }
  $('unapprove').onclick = function () { approveAction('Unapprove') }
  $('unit').onchange = $('period').onchange = function () {
    var dropped = g && g.changes().length
    if (hp) hp.reset()
    load().then(function () { if (dropped) say('Your unsaved changes were dropped when you switched.', 'err') }).catch(fail)
  }
  hp = Lens.historyPanel('#historyBtn', { describe: describe, title: 'History' })
  tg = Lens.live('#people', { onEvent: onLive })
  Promise.all([names(unitDim, unitNames), groupCfg ? names(groupCfg.dimension, groupNames) : null, Lens.whoami().then(function (w) { who = w })])
    .then(units).then(groups).then(load).catch(fail)
})()
</script>
</body>
</html>
