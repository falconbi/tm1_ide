name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22 (cache for both lockfiles)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install (root)
        run: npm ci

      - name: Install (client) — two .mjs tests import client code (clsx)
        working-directory: client
        run: npm ci

      - name: Build client (proves it compiles, and produces the bundles tests use)
        working-directory: client
        run: npm run build

      - name: static/ is current
        run: |
          if [ -n "$(git status --porcelain -- static)" ]; then
            git status --short -- static
            echo "static/ is out of date — run \`cd client && npm run build\` and commit static/"
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Lint ratchet (must only go down)
        working-directory: client
        run: |
          BASELINE=$(node -p "require('./lint-baseline.json').problems")
          COUNT=$(npm run lint:count 2>&1 | grep -oE '[0-9]+' | tail -1)
          echo "lint problems: ${COUNT} (baseline ${BASELINE})"
          if [ -z "$COUNT" ]; then
            echo "Could not read the lint problem count — inspect npm run lint:count."
            exit 1
          fi
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "Lint regressed: ${COUNT} > ${BASELINE}. Lower client/lint-baseline.json only when lint improves."
            exit 1
          fi