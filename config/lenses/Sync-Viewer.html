<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; background: #0b1220; color: #e2e8f0; padding: 20px; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { color: #64748b; font-size: 12px; margin-bottom: 14px; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .kpi { background: #111a2e; border: 1px solid #1e293b; border-radius: 10px; padding: 12px 14px; }
  .kpi .label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
  .kpi .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .note { font-size: 11px; color: #64748b; }
  .note b { color: #38bdf8; }
</style>
</head>
<body>
  <h1>Sync Viewer</h1>
  <div class="sub">Reacts to shared context from the Sync Driver</div>
  <div class="note">listening to context: <b id="ctxview">(none yet)</b></div>
  <div class="kpis" id="kpis"><div class="kpi"><div class="label">Units Sold</div><div class="value">…</div></div><div class="kpi"><div class="label">Region</div><div class="value">—</div></div><div class="kpi"><div class="label">Period</div><div class="value">—</div></div></div>
<script>
  var render = function (ctx) {
    var region = ctx.region || 'Total Company', period = ctx.period || 'Y2'
    document.getElementById('ctxview').textContent = JSON.stringify(ctx)
    var k = document.getElementById('kpis')
    var cells = k.querySelectorAll('.value')
    cells[1].textContent = region
    cells[2].textContent = period
    window.lensBridge.call('readCell', { cube: 'Revenue', coordinates: { organization: region, Channel: 'Channel Total', product: 'Product Total', Month: 'Year', Year: period, Version: 'Version 1', Revenue: 'Units Sold' } })
      .then(function (v) { cells[0].textContent = v == null ? '—' : Math.round(v).toLocaleString() })
      .catch(function (e) { cells[0].textContent = 'err: ' + e.message })
  }
  window.lensBridge.onContext(render)
  window.lensBridge.getContext().then(function (ctx) { render(ctx) })
</script>
</body>
</html>
